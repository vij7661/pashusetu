name: Admin Web CI

on:
  push:
    paths:
      - "apps/admin_web/**"
      - ".github/workflows/admin-web-ci.yml"
  pull_request:
    paths:
      - "apps/admin_web/**"
      - ".github/workflows/admin-web-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin_web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin_web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
