name: Farmer Mobile CI

on:
  push:
    paths:
      - "apps/farmer_mobile/**"
      - ".github/workflows/farmer-mobile-ci.yml"
  pull_request:
    paths:
      - "apps/farmer_mobile/**"
      - ".github/workflows/farmer-mobile-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/farmer_mobile

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android host for QA artifact
        run: flutter create --platforms=android --project-name pashusetu_farmer .
      - name: Configure generated Android QA host
        run: |
          python - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text(encoding="utf-8")
          marker = "        targetCompatibility = JavaVersion.VERSION_11\n"
          if marker not in text:
              raise SystemExit("Generated Flutter Android compileOptions template changed")
          text = text.replace(
              marker,
              marker + "        isCoreLibraryDesugaringEnabled = true\n",
              1,
          )
          text += (
              "\n"
              "dependencies {\n"
              "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n"
              "}\n"
          )
          gradle.write_text(text, encoding="utf-8")
          PY

          mkdir -p android/app/src/debug
          cat > android/app/src/debug/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:usesCleartextTraffic="true" />
          </manifest>
          EOF
      - name: Build emulator QA APK
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: pashusetu-farmer-manual-qa-emulator-apk
          path: apps/farmer_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
