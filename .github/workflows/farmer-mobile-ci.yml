name: Farmer Mobile CI

on:
  push:
    paths:
      - "apps/farmer_mobile/**"
      - ".github/workflows/farmer-mobile-ci.yml"
  pull_request:
    paths:
      - "apps/farmer_mobile/**"
      - ".github/workflows/farmer-mobile-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/farmer_mobile

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
