name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pashusetu_test
          POSTGRES_USER: pashusetu
          POSTGRES_PASSWORD: pashusetu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pashusetu -d pashusetu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://pashusetu:pashusetu@localhost:5432/pashusetu_test
      JWT_SECRET: ci-secret
      DEVELOPMENT_OTP_SEED: pashusetu-dev-otp-v1

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Legacy backend regression
        run: >-
          pytest -q
          --ignore=tests/test_farmer_registration_contract.py
          --ignore=tests/test_farmer_kyc_enforcement.py
      - name: Farmer OTP and fixture contract
        run: >-
          pytest -q
          tests/test_farmer_registration_contract.py::test_otp_contract_is_exactly_four_numeric_digits
          tests/test_farmer_registration_contract.py::test_farmer_positive_v2_fixture_integrity
      - name: Farmer registration lifecycle contract
        run: >-
          pytest -q
          tests/test_farmer_registration_contract.py::test_registration_resumes_and_farmer_id_is_created_only_after_kyc_submission
      - name: Farmer KYC transaction boundary
        run: pytest -q tests/test_farmer_kyc_enforcement.py
      - name: Farmer-change static analysis
        run: >-
          ruff check
          app/auth
          app/identity
          app/audit/service.py
          app/bidding/router.py
          app/marketplace/router.py
          app/marketplace/schemas.py
          app/marketplace/service.py
          app/weighment/router.py
          app/weighment/schemas.py
          app/transaction/router.py
          app/agreement/router.py
          app/agreement/schemas.py
          app/agreement/service.py
          app/payments/router.py
          app/payments/schemas.py
          app/disputes/router.py
          app/disputes/service.py
          app/logistics/router.py
          tests/test_farmer_registration_contract.py
          tests/test_farmer_kyc_enforcement.py
          tests/test_market_reference_contract.py
          tests/test_listing_acknowledgement_contract.py
          tests/test_weighment_authorization_contract.py
          tests/test_agreement_pilot_contract.py
          tests/test_dispute_trust_contract.py
          tests/test_transaction_trust_contract.py
          tests/fixtures/farmer_positive_v2.py
      - run: python scripts/export_openapi.py
