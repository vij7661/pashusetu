services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pashusetu
      POSTGRES_USER: pashusetu
      POSTGRES_PASSWORD: pashusetu
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pashusetu -d pashusetu"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pashusetu_pg:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      OTP_TEST_MODE: "true"
      DATABASE_ISOLATED_FOR_QA: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db_test:
    image: postgres:16
    environment:
      POSTGRES_DB: pashusetu_test
      POSTGRES_USER: pashusetu
      POSTGRES_PASSWORD: pashusetu
    ports:
      - "5433:5432"

volumes:
  pashusetu_pg:
